[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "causalspan"
version = "0.1.0a1"
description = "Local OpenTelemetry tracing, comparison, and tool replay for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["opentelemetry", "agents", "tracing", "replay", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-common>=1.39,<2",
]

[project.urls]
Repository = "https://github.com/xsparc/causalspan"
Issues = "https://github.com/xsparc/causalspan/issues"

[project.scripts]
causalspan = "causalspan.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/causalspan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
